<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الإدارة | أتيليه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="admin-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">🔐</div>
      <h1>لوحة تحكم أتيليه</h1>
      <p>سجّلي الدخول بحساب الإدارة</p>
    </div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">تسجيل الدخول</button>
    </form>

    <a href="../index.html" class="back-link">⟵ الرجوع للمتجر</a>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/admin-auth.js"></script>
</body>
</html>
